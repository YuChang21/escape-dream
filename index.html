<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>逃離夢境</title>
  <style>
    :root{
      --ink:#28305a;
      --panel:rgba(255,255,255,.88);
      --purple:#7b6df0;
      --pink:#ff8cc8;
      --yellow:#ffe78a;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      display:grid;
      place-items:center;
      overflow:hidden;
      font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.45), transparent 28%),
        radial-gradient(circle at 85% 12%, rgba(255,211,242,.45), transparent 24%),
        linear-gradient(180deg,#5c58c9 0%,#766ee0 45%,#a67bd9 100%);
      color:var(--ink);
    }

    .game-shell{
      position:relative;
      width:min(94vw,480px);
      aspect-ratio:2/3;
      max-height:94vh;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(28,20,80,.38), inset 0 0 0 3px rgba(255,255,255,.28);
      background:#746dd8;
      user-select:none;
    }

    canvas{
      display:block;
      width:100%;
      height:100%;
      background:transparent;
    }

    .hud{
      position:absolute;
      inset:14px 14px auto 14px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      pointer-events:none;
      z-index:5;
    }

    .hud-left,.hud-right{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }

    .chip{
      padding:7px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.82);
      box-shadow:0 3px 10px rgba(35,24,86,.14);
      font-weight:800;
      font-size:14px;
      backdrop-filter:blur(6px);
      white-space:nowrap;
    }

    .buffs{
      position:absolute;
      top:58px;
      right:14px;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:6px;
      z-index:5;
      pointer-events:none;
    }

    .buff{
      padding:6px 9px;
      border-radius:10px;
      background:rgba(33,31,75,.75);
      color:white;
      font-size:12px;
      font-weight:800;
      box-shadow:0 3px 10px rgba(0,0,0,.12);
    }

    .icon-button{
      position:absolute;
      right:14px;
      bottom:14px;
      z-index:12;
      border:none;
      border-radius:999px;
      width:42px;
      height:42px;
      font-size:20px;
      cursor:pointer;
      background:rgba(255,255,255,.86);
      box-shadow:0 4px 14px rgba(38,24,90,.2);
    }

    .overlay{
      position:absolute;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      padding:26px;
      background:linear-gradient(180deg,rgba(61,53,139,.18),rgba(42,35,101,.5));
      backdrop-filter:blur(2px);
    }

    .overlay.hidden{display:none}

    .panel{
      width:min(100%,390px);
      padding:26px 24px;
      border:3px solid rgba(255,255,255,.72);
      border-radius:24px;
      background:var(--panel);
      box-shadow:0 16px 40px rgba(32,24,91,.28);
      text-align:center;
    }

    h1{
      margin:0 0 8px;
      font-size:clamp(34px,8vw,50px);
      letter-spacing:2px;
      color:#5c4bc6;
      text-shadow:0 3px 0 #fff, 0 7px 0 rgba(255,174,219,.7);
    }

    h2{
      margin:0 0 12px;
      font-size:32px;
      color:#5b4bc3;
    }

    .subtitle{
      margin:0 0 18px;
      color:#645f87;
      line-height:1.7;
      font-weight:700;
    }

    .instructions{
      margin:16px 0;
      padding:12px 14px;
      border-radius:16px;
      background:#f1efff;
      line-height:1.8;
      font-size:14px;
      font-weight:700;
    }

    .intro-feather{
      width:34px;
      height:20px;
      object-fit:contain;
      vertical-align:middle;
      margin-right:4px;
      filter:drop-shadow(0 0 3px rgba(255,255,255,.9));
    }

    .button-row{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    button.action{
      border:none;
      border-radius:14px;
      padding:12px 20px;
      min-width:128px;
      font:inherit;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      color:white;
      background:linear-gradient(180deg,#8877f4,#6656d6);
      box-shadow:0 6px 0 #5143b7,0 9px 18px rgba(63,49,145,.24);
      transition:transform .08s ease,box-shadow .08s ease;
    }

    button.action:hover{transform:translateY(-1px)}
    button.action:active{
      transform:translateY(4px);
      box-shadow:0 2px 0 #5143b7,0 4px 10px rgba(63,49,145,.2);
    }

    button.secondary{
      background:linear-gradient(180deg,#ff9dcf,#ef75b6);
      box-shadow:0 6px 0 #cd5a9d,0 9px 18px rgba(145,49,104,.18);
    }

    .score-line{
      font-size:18px;
      font-weight:900;
      margin:8px 0;
    }

    .tiny{
      font-size:12px;
      color:#716b91;
      margin-top:10px;
    }

    @media (max-width:520px){
      .game-shell{
        width:100vw;
        height:100vh;
        max-height:none;
        aspect-ratio:auto;
        border-radius:0;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" id="gameShell">
    <canvas id="game" width="480" height="720" aria-label="逃離夢境遊戲畫面"></canvas>

    <section class="hud" id="hud">
      <div class="hud-left">
        <div class="chip" id="lifeHud">❤️❤️❤️</div>
        <div class="chip" id="timeHud">00:00</div>
      </div>
      <div class="hud-right">
        <div class="chip" id="scoreHud">Score 0</div>
        <div class="chip" id="bestHud">Best 0</div>
      </div>
    </section>

    <div class="buffs" id="buffHud"></div>
    <button class="icon-button" id="soundBtn" aria-label="切換音效">🔊</button>

    <section class="overlay" id="menuOverlay">
      <div class="panel">
        <h1>逃離夢境</h1>
        <p class="subtitle">一路向下逃離夢境，死掉就會永遠被困在夢裡。</p>

          ← → 或 A / D：左右移動<br>

          <strong>夢境道具</strong><br>

        <div class="score-line">最高紀錄：<span id="finalBest">0</span></div>
        <div class="button-row">
          <button class="action" id="restartBtn">再試一次</button>
          <button class="action secondary" id="gameOverMenuBtn">返回主選單</button>
        </div>
      </div>
    </section>
  </main>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    const lifeHud = document.getElementById("lifeHud");
    const scoreHud = document.getElementById("scoreHud");
    const bestHud = document.getElementById("bestHud");
    const timeHud = document.getElementById("timeHud");
    const buffHud = document.getElementById("buffHud");

    const menuOverlay = document.getElementById("menuOverlay");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const gameOverOverlay = document.getElementById("gameOverOverlay");

    const startBtn = document.getElementById("startBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const pauseRestartBtn = document.getElementById("pauseRestartBtn");
    const pauseMenuBtn = document.getElementById("pauseMenuBtn");
    const restartBtn = document.getElementById("restartBtn");
    const gameOverMenuBtn = document.getElementById("gameOverMenuBtn");
    const soundBtn = document.getElementById("soundBtn");

    const menuBest = document.getElementById("menuBest");
    const finalScore = document.getElementById("finalScore");
    const finalBest = document.getElementById("finalBest");

    const keys = { left:false, right:false };

    let state = "menu";
    let score = 0;
    let scoreExact = 0;
    let best = Number(localStorage.getItem("escapeDreamBest") || 0);
    let lives = 3;
    let elapsed = 0;
    let lastTime = performance.now();
    let platformId = 0;
    let platforms = [];
    let items = [];
    let particles = [];
    let lastSafe = null;
    let lastLanded = null;
    let standingPlatformId = null;
    let hurtFlash = 0;
    let shake = 0;

    let doubleTimer = 0;
    let speedBuffTimer = 0;
    let nextDouble = 60;
    let nextSpeed = 60;

    let soundOn = true;
    let audioCtx = null;
    let musicTimer = null;
    let musicStep = 0;
const player = {
      x: W * 0.5 - 16,
      y: 155,
      w: 32,
      h: 46,
      vy: 0,
      baseSpeed: 260,
      gravity: 1250,
      invincible: 0,
      facing: 1
    };

    function rand(min, max){ return Math.random() * (max - min) + min; }
    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function formatTime(seconds){
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    }

    function pointsPerSecond(){
      // 0～1 分鐘：每秒 5 分
      // 1～2 分鐘：每秒 10 分
      // 2～3 分鐘：每秒 20 分
      // 之後每過 1 分鐘再翻倍
      const minuteStage = Math.floor(elapsed / 60);
      return 5 * Math.pow(2, minuteStage);
    }

    function scrollMultiplier(){
      // 0:00～1:59：每 30 秒增加 0.5 倍
      // 1.0x → 1.5x → 2.0x → 2.5x
      if(elapsed < 120){
        return 1 + Math.floor(elapsed / 30) * 0.5;
      }

      // 2:00 起先到 3.0x，
      // 之後每過 1 分鐘再增加 0.5 倍
      return 3 + Math.floor((elapsed - 120) / 60) * 0.5;
    }

    function platformProbType(){
      const r = Math.random();

      // 0:00 ～ 1:59
      // 普通 70% / 尖刺 10% / 移動 10% / 碎裂 10%
      if(elapsed < 120){
        if(r < 0.70) return "normal";
        if(r < 0.80) return "spike";
        if(r < 0.90) return "moving";
        return "break";
      }

      // 2:00 之後
      // 普通 40% / 移動 20% / 尖刺 20% / 碎裂 20%
      if(r < 0.40) return "normal";
      if(r < 0.60) return "moving";
      if(r < 0.80) return "spike";
      return "break";
    }

    function createPlatform(y, forcedType = null, xHint = null){
      const type = forcedType || platformProbType();
      const width = type === "moving" ? rand(98,122) : rand(96,126);
      let x;

      if(xHint == null){
        x = rand(18, W - width - 18);
      }else{
        const maxShift = 145;
        x = clamp(xHint + rand(-maxShift,maxShift), 16, W - width - 16);
      }

      return {
        id: ++platformId,
        type,
        x,
        y,
        w: width,
        h: 18,
        dir: Math.random() < 0.5 ? -1 : 1,
        moveSpeed: rand(42,66),
        breaking: false,
        breakTimer: 0,
        scored: false,
        alive: true,

        // 平台一旦進入過畫面，就不能再被後續道具生成選中
        hasAppeared: y <= H,

        cloudVariant: Math.random() < 0.5 ? 0 : 1
      };
    }

    function resetGame(){
      score = 0;
      scoreExact = 0;
      lives = 3;
      elapsed = 0;
      doubleTimer = 0;
      speedBuffTimer = 0;

      // 補血維持固定每 90 秒；其他 Buff 從遊戲前期就可能出現
      nextDouble = rand(5,18);
      nextSpeed = rand(5,18);
      platforms = [];
      items = [];
      particles = [];
      standingPlatformId = null;
      hurtFlash = 0;
      shake = 0;

      player.x = W * 0.5 - player.w * 0.5;
      player.y = 145;
      player.vy = 0;
      player.invincible = 0;

      const start = createPlatform(205, "normal", W * 0.5 - 55);
      start.x = W * 0.5 - start.w * 0.5;
      start.scored = true;
      platforms.push(start);
      standingPlatformId = start.id;

      lastSafe = { id:start.id, x:start.x, y:start.y, w:start.w };
      lastLanded = { id:start.id, type:start.type, x:start.x, y:start.y, w:start.w };

      let y = 295;
      let hint = start.x;
      while(y < H + 80){
        const p = createPlatform(y, null, hint);
        platforms.push(p);

        // 只有尚未進入畫面的平台才可能預先帶愛心
        maybeSpawnHealOnPlatform(p);

        hint = p.x;
        y += rand(95,125);
      }

      // 開局即先嘗試把一個 Buff 放到「尚未進入畫面」的平台。
      // 它之後隨平台進入畫面，不會突然生成在玩家已看過的平台上。
      const openingBuff = Math.random() < 0.5 ? "double" : "speed";
      spawnItem(openingBuff);

      updateHud();
    }

    function startGame(){
      ensureAudio();
      resetGame();
      state = "playing";
      menuOverlay.classList.add("hidden");
      pauseOverlay.classList.add("hidden");
      gameOverOverlay.classList.add("hidden");
      lastTime = performance.now();
      startMusic();
      sfx("start");
    }

    function returnToMenu(){
      state = "menu";
      stopMusic();
      menuOverlay.classList.remove("hidden");
      pauseOverlay.classList.add("hidden");
      gameOverOverlay.classList.add("hidden");
      menuBest.textContent = best;
    }

    function togglePause(){
      if(state === "playing"){
        state = "paused";
        pauseOverlay.classList.remove("hidden");
        stopMusic();
      }else if(state === "paused"){
        state = "playing";
        pauseOverlay.classList.add("hidden");
        lastTime = performance.now();
        startMusic();
      }
    }

    function endGame(){
      state = "gameover";
      stopMusic();

      score = Math.floor(scoreExact);

      if(score > best){
        best = score;
        localStorage.setItem("escapeDreamBest", String(best));
      }

      finalScore.textContent = score;
      finalBest.textContent = best;
      menuBest.textContent = best;
      bestHud.textContent = "Best " + best;
      gameOverOverlay.classList.remove("hidden");
      sfx("gameover");
    }

    function loseLife(reason){
      if(player.invincible > 0 || state !== "playing") return;

      lives--;
      // 任何受傷（尖刺、掉入虛空、碰到上下邊界）後，
      // 都進入 2 秒無敵狀態；掉入虛空復活後也會保留這段無敵時間。
      player.invincible = 2.0;
      hurtFlash = 0.35;
      shake = 0.28;
      spawnBurst(player.x + player.w/2, player.y + player.h/2, "hurt");
      sfx(reason === "void" ? "fall" : "hurt");

      if(lives <= 0){
        updateHud();
        endGame();
        return;
      }

      if(reason === "void"){
        respawnAtSafePlatform();
      }
      updateHud();
    }

    function respawnAtSafePlatform(){
      let safe = null;
      let dangerY = null;
      let dangerX = null;
      let dangerW = null;

      if(lastLanded){
        const landedNow = platforms.find(p => p.id === lastLanded.id && p.alive);

        // 最後踩到普通 / 移動平台：直接回原本的平台
        if(lastLanded.type === "normal" || lastLanded.type === "moving"){
          safe = landedNow;
        }else{
          // 最後踩到尖刺 / 碎裂平台：
          // 一律找它「上方最近」的既有安全平台
          dangerY = landedNow ? landedNow.y : lastLanded.y;
          dangerX = landedNow ? landedNow.x : lastLanded.x;
          dangerW = landedNow ? landedNow.w : lastLanded.w;

          const safeAbove = platforms
            .filter(p =>
              p.alive &&
              (p.type === "normal" || p.type === "moving") &&
              p.y < dangerY &&
              p.y >= 70
            )
            .sort((a,b) => b.y - a.y);

          if(safeAbove.length){
            safe = safeAbove[0];
          }
        }
      }

      // 若最後踩的是安全平台，但它已離開畫面，
      // 再嘗試使用之前記錄的安全平台。
      if(!safe && (!lastLanded || lastLanded.type === "normal" || lastLanded.type === "moving")){
        safe = platforms.find(p =>
          p.id === lastSafe?.id &&
          p.alive &&
          (p.type === "normal" || p.type === "moving") &&
          p.y >= 70 &&
          p.y <= H - 100
        );
      }

      // 危險平台情況真的找不到上方安全平台時，
      // 才建立一個「明確位於危險平台上方」的臨時安全平台。
      // 不再固定生成在畫面中央，避免與危險平台重疊。
      if(!safe && dangerY !== null){
        const emergencyY = clamp(dangerY - 115, 90, H - 150);

        let emergencyX = clamp(
          (dangerX ?? W/2) + ((dangerW ?? 100) / 2) - 55,
          24,
          W - 134
        );

        safe = createPlatform(emergencyY, "normal", emergencyX);
        safe.x = emergencyX;
        safe.y = emergencyY;
        safe.scored = true;
        safe.hasAppeared = true;
        platforms.push(safe);
      }

      // 一般最後備援：只有真的完全沒有可用平台時才建立，
      // 並放在較安全的位置。
      if(!safe){
        const px = clamp(lastSafe?.x ?? W/2 - 55, 24, W - 134);
        safe = createPlatform(H * 0.42, "normal", px);
        safe.x = px;
        safe.y = H * 0.42;
        safe.scored = true;
        safe.hasAppeared = true;
        platforms.push(safe);
      }

      lastSafe = {
        id: safe.id,
        x: safe.x,
        y: safe.y,
        w: safe.w
      };

      lastLanded = {
        id: safe.id,
        type: safe.type,
        x: safe.x,
        y: safe.y,
        w: safe.w
      };

      player.x = clamp(
        safe.x + safe.w/2 - player.w/2,
        0,
        W - player.w
      );
      player.y = safe.y - player.h - 2;
      player.vy = 0;
      standingPlatformId = safe.id;
    }

    function updateHud(){
      lifeHud.textContent = "❤️".repeat(Math.max(0,lives)) + "♡".repeat(Math.max(0,3-lives));
      scoreHud.textContent = "Score " + score;
      bestHud.textContent = "Best " + Math.max(best, score);
      timeHud.textContent = formatTime(elapsed);

      const buffLines = [];
      if(doubleTimer > 0) buffLines.push(`<div class="buff">⭐ 雙倍分數 ${doubleTimer.toFixed(1)}s</div>`);
      if(speedBuffTimer > 0) buffLines.push(`<div class="buff">🪶 移動速度 +50% ${speedBuffTimer.toFixed(1)}s</div>`);
      buffHud.innerHTML = buffLines.join("");
    }

    function updatePlatforms(dt){
      const scroll = 38 * scrollMultiplier();
      let currentStanding = platforms.find(p => p.id === standingPlatformId);

      for(const p of platforms){
        if(!p.alive) continue;

        const oldX = p.x;

        if(p.type === "moving"){
          p.x += p.dir * p.moveSpeed * dt;
          if(p.x < 12){
            p.x = 12;
            p.dir = 1;
          }
          if(p.x + p.w > W - 12){
            p.x = W - 12 - p.w;
            p.dir = -1;
          }
        }

        p.y -= scroll * dt;

        // 只要平台曾經進入畫面，就永久記錄
        if(p.y <= H){
          p.hasAppeared = true;
        }

        if(currentStanding && p.id === currentStanding.id){
          player.x += p.x - oldX;
        }

        if(p.breaking){
          p.breakTimer -= dt;
          if(p.breakTimer <= 0){
            p.alive = false;
            if(standingPlatformId === p.id){
              standingPlatformId = null;
              player.vy = 90;
            }
            spawnBurst(p.x + p.w/2, p.y, "glass");
            sfx("break");
          }
        }
      }

      platforms = platforms.filter(p => p.alive && p.y > -80);

      if(standingPlatformId && !platforms.some(p => p.id === standingPlatformId)){
        standingPlatformId = null;
      }

      let bottom = platforms.reduce((a,b) => a.y > b.y ? a : b, platforms[0]);
      while(bottom && bottom.y < H + 20){
        const gap = rand(95,125);
        const newP = createPlatform(bottom.y + gap, null, bottom.x);
        platforms.push(newP);

        // 新平台尚未進畫面時，就先決定是否帶愛心
        maybeSpawnHealOnPlatform(newP);

        bottom = newP;
      }
    }

    function updatePlayer(dt){
      if(player.invincible > 0) player.invincible -= dt;
      if(hurtFlash > 0) hurtFlash -= dt;
      if(shake > 0) shake -= dt;

      const moveSpeed = player.baseSpeed * (speedBuffTimer > 0 ? 1.5 : 1);
      let move = 0;
      if(keys.left) move -= 1;
      if(keys.right) move += 1;
      if(move !== 0) player.facing = move;

      player.x += move * moveSpeed * dt;

      // 左右邊界穿越：從左側出去會從右側回來，反之亦然
      if(player.x + player.w < 0){
        player.x = W;
      }else if(player.x > W){
        player.x = -player.w;
      }

      const standing = platforms.find(p => p.id === standingPlatformId && p.alive);

      if(standing){
        const onTop = player.x + player.w > standing.x + 4 && player.x < standing.x + standing.w - 4;

        if(onTop){
          player.y = standing.y - player.h;
          player.vy = 0;

          // 角色只要碰到遊戲畫面最上緣，就立即扣 1 血並復活。
          if(player.y <= 0){
            loseLife("void");
            return;
          }

          if(standing.y < 88){
            standingPlatformId = null;
            player.vy = 100;
          }
          return;
        }else{
          standingPlatformId = null;
          player.vy = 40;
        }
      }

      const prevBottom = player.y + player.h;
      player.vy += player.gravity * dt;
      player.y += player.vy * dt;
      const newBottom = player.y + player.h;

      if(player.vy >= 0){
        let landing = null;
        for(const p of platforms){
          if(!p.alive) continue;
          const horizontal = player.x + player.w - 5 > p.x && player.x + 5 < p.x + p.w;
          const crossed = prevBottom <= p.y + 5 && newBottom >= p.y && newBottom <= p.y + p.h + 20;
          if(horizontal && crossed){
            if(!landing || p.y < landing.y) landing = p;
          }
        }

        if(landing){
          landOnPlatform(landing);
        }
      }

      // 角色只要碰到遊戲畫面上下邊界，就視為掉入危險區域。
      if(player.y <= 0){
        loseLife("void");
        return;
      }

      // 不管下方是否還有平台，碰到最下緣也會立即扣 1 血並復活。
      if(player.y + player.h >= H){
        loseLife("void");
        return;
      }
    }

    function landOnPlatform(p){
      player.y = p.y - player.h;
      player.vy = 0;
      standingPlatformId = p.id;

      // 記錄玩家最後一次真正踩到的平台。
      // 掉入虛空時會優先依照這個平台決定復活位置。
      lastLanded = {
        id: p.id,
        type: p.type,
        x: p.x,
        y: p.y,
        w: p.w
      };

      if(!p.scored){
        // 平台只負責記錄是否已踩過；分數改為依存活時間累積。
        p.scored = true;
        spawnBurst(player.x + player.w/2, player.y + player.h, "score");
        sfx("land");
      }

      if(p.type === "normal" || p.type === "moving"){
        lastSafe = { id:p.id, x:p.x, y:p.y, w:p.w };
      }

      if(p.type === "spike"){
        loseLife("spike");
      }

      if(p.type === "break" && !p.breaking){
        p.breaking = true;
        p.breakTimer = 0.5;
      }

      updateHud();
    }

    function scheduleItems(){
      // 愛心泡泡已改為跟隨新平台隨機生成，不再受時間限制。

      // 金色星星與風之羽毛：前期即可出現。
      // 只有成功放到「尚未進畫面」的平台後，才開始計算下一次。
      if(elapsed >= nextDouble){
        if(spawnItem("double")){
          nextDouble = elapsed + rand(45,75);
        }
      }

      if(elapsed >= nextSpeed){
        if(spawnItem("speed")){
          nextSpeed = elapsed + rand(45,75);
        }
      }
    }

    function maybeSpawnHealOnPlatform(p){
      if(
        !p ||
        !p.alive ||
        p.hasAppeared ||
        !(p.type === "normal" || p.type === "moving") ||
        items.some(i => i.platformId === p.id)
      ){
        return;
      }

      // 愛心泡泡不再受時間限制：
      // 每個新生成、尚未進入畫面的安全平台有 10% 機率帶一顆愛心。
      if(Math.random() < 0.10){
        items.push({
          type: "heal",
          platformId: p.id,
          bob: Math.random() * Math.PI * 2,
          collected: false
        });
      }
    }

    function spawnItem(type){
      const candidates = platforms.filter(p =>
        p.alive &&
        !p.scored &&
        !p.hasAppeared &&
        !items.some(i => i.platformId === p.id) &&
        (p.type === "normal" || p.type === "moving") &&
        p.y > H
      );

      // 沒有尚未進入畫面的平台時，這次先不生成。
      // 下一幀會繼續嘗試，不會把道具補到已出現的平台上。
      if(!candidates.length) return false;

      const p = candidates[Math.floor(Math.random() * candidates.length)];
      items.push({
        type,
        platformId:p.id,
        bob:Math.random() * Math.PI * 2,
        collected:false
      });

      return true;
    }

    function updateItems(dt){
      for(const item of items){
        if(item.collected) continue;
        item.bob += dt * 3.4;

        const p = platforms.find(p => p.id === item.platformId && p.alive);
        if(!p){
          item.collected = true;
          continue;
        }

        const ix = p.x + p.w/2;
        const iy = p.y - 22 + Math.sin(item.bob) * 4;

        if(rectCircleHit(player.x,player.y,player.w,player.h,ix,iy,14)){
          item.collected = true;
          collectItem(item.type, ix, iy);
        }
      }

      items = items.filter(i => !i.collected);
    }

    function collectItem(type, x, y){
      if(type === "heal"){
        if(lives < 3) lives++;
        sfx("heal");
      }else if(type === "double"){
        // 同類 Buff 不疊加；重複吃到只會把時間重置回 10 秒
        doubleTimer = 10;
        sfx("power");
      }else if(type === "speed"){
        // 同類 Buff 不疊加；重複吃到只會把時間重置回 10 秒
        speedBuffTimer = 10;
        sfx("power");
      }
      spawnBurst(x,y,type);
      updateHud();
    }

    function rectCircleHit(rx,ry,rw,rh,cx,cy,cr){
      const nx = clamp(cx,rx,rx+rw);
      const ny = clamp(cy,ry,ry+rh);
      const dx = cx - nx;
      const dy = cy - ny;
      return dx*dx + dy*dy <= cr*cr;
    }

    function spawnBurst(x,y,type){
      for(let i=0;i<10;i++){
        particles.push({
          x,y,
          vx:rand(-90,90),
          vy:rand(-120,-20),
          life:rand(.35,.75),
          maxLife:.75,
          size:rand(3,7),
          type
        });
      }
    }

    function updateParticles(dt){
      for(const p of particles){
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 180 * dt;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function update(dt){
      if(state !== "playing") return;

      // 分數完全依存活時間累積。
      // 金色星星生效時，當下的每秒得分再乘以 2。
      const currentRate = pointsPerSecond();
      const scoreMultiplier = doubleTimer > 0 ? 2 : 1;
      scoreExact += currentRate * scoreMultiplier * dt;
      score = Math.floor(scoreExact);

      elapsed += dt;
      if(doubleTimer > 0) doubleTimer = Math.max(0, doubleTimer - dt);
      if(speedBuffTimer > 0) speedBuffTimer = Math.max(0, speedBuffTimer - dt);

      updatePlatforms(dt);
      updatePlayer(dt);
      updateItems(dt);
      updateParticles(dt);
      scheduleItems();
      updateHud();
    }

    function draw(){
      ctx.save();

      if(shake > 0 && state === "playing"){
        ctx.translate(rand(-4,4), rand(-3,3));
      }

      drawDreamBackground();

      if(state !== "menu"){
        drawPlatforms();
        drawItems();
        drawPlayer();
        drawParticles();
        drawDreamMist();
      }else{
        drawMenuScene();
      }

      if(hurtFlash > 0){
        ctx.fillStyle = `rgba(255,80,120,${hurtFlash * 0.6})`;
        ctx.fillRect(0,0,W,H);
      }

      ctx.restore();
    }

    function drawDreamBackground(){
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,"#5a59bf");
      g.addColorStop(.48,"#8074dd");
      g.addColorStop(1,"#b081db");
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);

      // moon
      ctx.save();
      ctx.globalAlpha = .9;
      ctx.fillStyle = "#fff3b8";
      ctx.beginPath();
      ctx.arc(390,98,42,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle = "#6962c9";
      ctx.beginPath();
      ctx.arc(406,83,36,0,Math.PI*2);
      ctx.fill();
      ctx.restore();

      // stars
      for(let i=0;i<34;i++){
        const x = (i*83 % W + Math.sin(i*12.7)*35 + W) % W;
        const baseY = (i*127 % H);
        const y = (baseY - elapsed*5*(i%3+1)) % H;
        const yy = y < 0 ? y + H : y;
        const tw = .45 + .45*Math.sin(elapsed*2+i);
        ctx.fillStyle = `rgba(255,247,202,${tw})`;
        ctx.beginPath();
        ctx.arc(x,yy, i%5===0 ? 2.2 : 1.3,0,Math.PI*2);
        ctx.fill();
      }

      // dreamy distant doors / books / bubbles
      ctx.save();
      ctx.globalAlpha = .14;
      for(let i=0;i<7;i++){
        const x = 20 + (i*71)%430;
        const y = ((i*151 - elapsed*8) % 820 + 820) % 820 - 60;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.strokeRect(x,y,28,46);
        ctx.beginPath();
        ctx.arc(x+21,y+24,2,0,Math.PI*2);
        ctx.fillStyle="#fff";
        ctx.fill();
      }
      ctx.restore();

      // clouds
      drawCloud(68,130,1.1,.16);
      drawCloud(360,260,.82,.13);
      drawCloud(110,510,.9,.12);
    }

    function drawCloud(x,y,s,alpha){
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle="#ffffff";
      ctx.beginPath();
      ctx.arc(x,y,28*s,0,Math.PI*2);
      ctx.arc(x+28*s,y-10*s,22*s,0,Math.PI*2);
      ctx.arc(x+54*s,y,30*s,0,Math.PI*2);
      ctx.rect(x-4*s,y,62*s,24*s);
      ctx.fill();
      ctx.restore();
    }

    function drawMenuScene(){
      // floating silhouette stairs
      ctx.save();
      ctx.globalAlpha = .28;
      for(let i=0;i<6;i++){
        const y = 240 + i*78;
        const x = i%2 ? 240 : 70;
        drawCloudPlatformShape(x,y,145,22);
      }
      ctx.restore();

      drawSleepingChild(W/2,560,1.15);
    }

    function drawPlatforms(){
      for(const p of platforms){
        if(!p.alive) continue;
        if(p.type === "normal") drawNormalPlatform(p);
        else if(p.type === "spike") drawSpikePlatform(p);
        else if(p.type === "moving") drawMovingPlatform(p);
        else drawBreakPlatform(p);
      }
    }

    function drawCloudPlatformShape(x,y,w,h){
      ctx.save();
      ctx.fillStyle="#f8f7ff";
      ctx.strokeStyle="#d6d1ff";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.roundRect(x,y,w,h,10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle="#ffffff";
      ctx.beginPath();
      ctx.arc(x+w*.22,y+2,14,0,Math.PI*2);
      ctx.arc(x+w*.42,y-4,17,0,Math.PI*2);
      ctx.arc(x+w*.62,y+2,13,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function drawNormalPlatform(p){
      if(p.cloudVariant === 0){
        drawCloudPlatformShape(p.x,p.y,p.w,p.h);
      }else{
        ctx.save();
        ctx.fillStyle="#ffd6ec";
        ctx.strokeStyle="#e99bc7";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.roundRect(p.x,p.y,p.w,p.h,8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle="rgba(255,255,255,.55)";
        ctx.fillRect(p.x+10,p.y+4,p.w-20,4);
        ctx.restore();
      }
    }

    function drawSpikePlatform(p){
      drawCloudPlatformShape(p.x,p.y,p.w,p.h);
      ctx.save();
      ctx.fillStyle="#5c4c8e";
      ctx.strokeStyle="#43356f";
      ctx.lineWidth=2;
      const n = Math.max(4,Math.floor(p.w/18));
      for(let i=0;i<n;i++){
        const sx = p.x + 5 + i*(p.w-10)/n;
        const sw = (p.w-10)/n;
        ctx.beginPath();
        ctx.moveTo(sx,p.y);
        ctx.lineTo(sx+sw/2,p.y-18);
        ctx.lineTo(sx+sw,p.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawMovingPlatform(p){
      ctx.save();
      ctx.fillStyle="#f7e4a6";
      ctx.strokeStyle="#9a7b3a";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.roundRect(p.x,p.y,p.w,p.h,4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle="#fff4c7";
      ctx.fillRect(p.x+7,p.y+3,p.w-14,5);
      ctx.strokeStyle="rgba(90,62,35,.35)";
      ctx.beginPath();
      ctx.moveTo(p.x+p.w/2,p.y+1);
      ctx.lineTo(p.x+p.w/2,p.y+p.h-1);
      ctx.stroke();

      ctx.fillStyle="#fff1b8";
      ctx.beginPath();
      ctx.arc(p.x+p.w*.5,p.y-12,12,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function drawBreakPlatform(p){
      ctx.save();
      ctx.globalAlpha = p.breaking ? .55 + .25*Math.sin(performance.now()/35) : .9;
      ctx.fillStyle="rgba(188,240,255,.62)";
      ctx.strokeStyle="#c9f8ff";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.roundRect(p.x,p.y,p.w,p.h,5);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle="rgba(83,123,188,.75)";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(p.x+p.w*.35,p.y+1);
      ctx.lineTo(p.x+p.w*.48,p.y+8);
      ctx.lineTo(p.x+p.w*.42,p.y+p.h-1);
      ctx.moveTo(p.x+p.w*.66,p.y+1);
      ctx.lineTo(p.x+p.w*.58,p.y+7);
      ctx.lineTo(p.x+p.w*.69,p.y+p.h-1);
      ctx.stroke();
      ctx.restore();
    }

    function drawItems(){
      for(const item of items){
        if(item.collected) continue;
        const p = platforms.find(p => p.id === item.platformId && p.alive);
        if(!p) continue;

        const x = p.x + p.w/2;
        const y = p.y - 22 + Math.sin(item.bob)*4;

        ctx.save();
        ctx.shadowColor="rgba(255,255,255,.8)";
        ctx.shadowBlur=12;

        if(item.type === "heal") drawHeartBubble(x,y);
        else if(item.type === "double") drawStar(x,y);
        else drawFeather(x,y);

        ctx.restore();
      }
    }

    function drawHeartBubble(x,y){
      ctx.fillStyle="rgba(255,220,241,.55)";
      ctx.strokeStyle="#fff";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(x,y,14,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle="#ff669f";
      ctx.beginPath();
      ctx.moveTo(x,y+7);
      ctx.bezierCurveTo(x-14,y-2,x-10,y-11,x-4,y-9);
      ctx.bezierCurveTo(x,y-9,x,y-5,x,y-3);
      ctx.bezierCurveTo(x,y-5,x+3,y-9,x+8,y-9);
      ctx.bezierCurveTo(x+15,y-6,x+13,y+2,x,y+7);
      ctx.fill();
    }

    function drawStar(x,y){
      ctx.fillStyle="#ffd84d";
      ctx.strokeStyle="#fff3a4";
      ctx.lineWidth=2;
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const a = -Math.PI/2 + i*Math.PI/5;
        const r = i%2===0 ? 14 : 6;
        const px = x + Math.cos(a)*r;
        const py = y + Math.sin(a)*r;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawFeather(x,y){
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(-.35);
      ctx.strokeStyle="#f4fbff";
      ctx.fillStyle="#d6fbff";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.ellipse(0,0,7,16,.15,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle="#73b8d6";
      ctx.beginPath();
      ctx.moveTo(0,-13);
      ctx.lineTo(0,17);
      ctx.moveTo(0,-6);
      ctx.lineTo(-6,-1);
      ctx.moveTo(0,0);
      ctx.lineTo(6,5);
      ctx.moveTo(0,6);
      ctx.lineTo(-5,11);
      ctx.stroke();
      ctx.restore();
    }

    function drawPlayer(){
      const alpha = player.invincible > 0 && Math.floor(player.invincible*12)%2===0 ? .35 : 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(player.x + player.w/2, player.y);

      // sleep cap
      ctx.fillStyle="#ffd2e8";
      ctx.strokeStyle="#704e8d";
      ctx.lineWidth=2.5;
      ctx.beginPath();
      ctx.moveTo(-11,6);
      ctx.quadraticCurveTo(-2,-10,13,2);
      ctx.quadraticCurveTo(21,8,15,15);
      ctx.quadraticCurveTo(5,7,-11,6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle="#fff0f8";
      ctx.beginPath();
      ctx.arc(16,14,4,0,Math.PI*2);
      ctx.fill();

      // head
      ctx.fillStyle="#ffd5b5";
      ctx.strokeStyle="#704e8d";
      ctx.beginPath();
      ctx.arc(0,17,12,0,Math.PI*2);
      ctx.fill();
      ctx.stroke();

      // hair
      ctx.fillStyle="#5f4a54";
      ctx.beginPath();
      ctx.arc(-4,10,7,Math.PI,Math.PI*2);
      ctx.arc(4,10,7,Math.PI,Math.PI*2);
      ctx.fill();

      // face
      ctx.strokeStyle="#4a395e";
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(player.facing>0 ? 1 : -7,17);
      ctx.lineTo(player.facing>0 ? 5 : -3,17);
      ctx.stroke();

      // pajama body
      ctx.fillStyle="#a6d7ff";
      ctx.strokeStyle="#704e8d";
      ctx.beginPath();
      ctx.roundRect(-11,29,22,24,6);
      ctx.fill();
      ctx.stroke();

      // arms
      ctx.lineWidth=5;
      ctx.strokeStyle="#a6d7ff";
      ctx.beginPath();
      ctx.moveTo(-9,35);
      ctx.lineTo(-15,44);
      ctx.moveTo(9,35);
      ctx.lineTo(15,44);
      ctx.stroke();

      // legs
      ctx.lineWidth=6;
      ctx.beginPath();
      ctx.moveTo(-6,51);
      ctx.lineTo(-7,61);
      ctx.moveTo(6,51);
      ctx.lineTo(7,61);
      ctx.stroke();

      ctx.restore();
    }

    function drawSleepingChild(x,y,s){
      ctx.save();
      ctx.translate(x,y);
      ctx.scale(s,s);
      ctx.globalAlpha=.45;
      ctx.fillStyle="#ffffff";
      ctx.beginPath();
      ctx.arc(0,0,24,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#d3c7ff";
      ctx.beginPath();
      ctx.roundRect(-18,22,36,42,12);
      ctx.fill();
      ctx.fillStyle="#fff";
      ctx.font="bold 26px sans-serif";
      ctx.fillText("Z",24,-18);
      ctx.font="bold 18px sans-serif";
      ctx.fillText("z",46,-34);
      ctx.restore();
    }

    function drawParticles(){
      for(const p of particles){
        const a = clamp(p.life / p.maxLife,0,1);
        ctx.save();
        ctx.globalAlpha=a;
        if(p.type === "hurt") ctx.fillStyle="#ff6b9a";
        else if(p.type === "glass") ctx.fillStyle="#c8f7ff";
        else if(p.type === "heal") ctx.fillStyle="#ff9ac8";
        else if(p.type === "double") ctx.fillStyle="#ffe16b";
        else if(p.type === "speed") ctx.fillStyle="#d8fbff";
        else ctx.fillStyle="#ffffff";
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawDreamMist(){
      const g = ctx.createLinearGradient(0,H-80,0,H);
      g.addColorStop(0,"rgba(255,255,255,0)");
      g.addColorStop(1,"rgba(238,221,255,.42)");
      ctx.fillStyle=g;
      ctx.fillRect(0,H-80,W,80);
    }

    function ensureAudio(){
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if(audioCtx.state === "suspended"){
        audioCtx.resume();
      }
    }

    function tone(freq, duration=.09, type="sine", volume=.025, delay=0){
      if(!soundOn) return;
      ensureAudio();
      const t = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq,t);
      gain.gain.setValueAtTime(0,t);
      gain.gain.linearRampToValueAtTime(volume,t+.01);
      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t+duration+.02);
    }

    function sfx(kind){
      if(!soundOn) return;
      if(kind === "land") tone(420,.06,"triangle",.018);
      if(kind === "hurt"){ tone(165,.12,"sawtooth",.03); tone(120,.15,"square",.018,.04); }
      if(kind === "fall"){ tone(240,.1,"triangle",.028); tone(130,.18,"triangle",.02,.08); }
      if(kind === "heal"){ tone(520,.08,"sine",.025); tone(660,.12,"sine",.022,.07); }
      if(kind === "power"){ tone(440,.07,"triangle",.02); tone(660,.08,"triangle",.022,.06); tone(880,.1,"triangle",.02,.12); }
      if(kind === "break"){ tone(300,.07,"square",.018); tone(210,.1,"square",.016,.04); }
      if(kind === "start"){ tone(392,.08,"sine",.02); tone(523,.09,"sine",.02,.08); tone(659,.12,"sine",.018,.16); }
      if(kind === "gameover"){ tone(330,.12,"triangle",.02); tone(247,.16,"triangle",.018,.12); tone(196,.24,"triangle",.017,.25); }
    }

    function startMusic(){
      if(!soundOn || musicTimer) return;
      ensureAudio();
      const notes = [261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
      musicTimer = setInterval(() => {
        if(state !== "playing" || !soundOn) return;
        const n = notes[musicStep % notes.length];
        tone(n,.34,"sine",.006);
        tone(n/2,.42,"triangle",.0035,.02);
        musicStep++;
      }, 560);
    }

    function stopMusic(){
      if(musicTimer){
        clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    function toggleSound(){
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? "🔊" : "🔇";
      if(soundOn && state === "playing") startMusic();
      else stopMusic();
    }

    function loop(now){
      const rawDt = (now - lastTime) / 1000;
      const dt = Math.min(rawDt, 0.033);
      lastTime = now;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();

      if(["arrowleft","arrowright","a","d","p","enter"," "].includes(k)){
        e.preventDefault();
      }

      if(k === "arrowleft" || k === "a") keys.left = true;
      if(k === "arrowright" || k === "d") keys.right = true;

      if(k === "p"){
        togglePause();
      }

      if(k === "enter"){
        if(state === "menu") startGame();
        else if(state === "gameover") startGame();
      }
    }, {passive:false});

    window.addEventListener("keyup", e => {
      const k = e.key.toLowerCase();
      if(k === "arrowleft" || k === "a") keys.left = false;
      if(k === "arrowright" || k === "d") keys.right = false;
    });

    window.addEventListener("blur", () => {
      keys.left = false;
      keys.right = false;
      if(state === "playing") togglePause();
    });

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
    resumeBtn.addEventListener("click", togglePause);
    pauseRestartBtn.addEventListener("click", startGame);
    pauseMenuBtn.addEventListener("click", returnToMenu);
    gameOverMenuBtn.addEventListener("click", returnToMenu);
    soundBtn.addEventListener("click", toggleSound);

    menuBest.textContent = best;
    bestHud.textContent = "Best " + best;
    updateHud();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
